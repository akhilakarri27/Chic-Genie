<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" width="100%" height="100%" style="background:#090B10; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2D1A3"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#0E121D"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Filters for Glow & Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D4AF37"/>
    </marker>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="800" cy="100" r="450" fill="#1C2438" opacity="0.45"/>
  <circle cx="200" cy="700" r="300" fill="#141E33" opacity="0.3"/>
  <circle cx="1400" cy="700" r="300" fill="#201633" opacity="0.3"/>

  <!-- ==================== HEADER SECTION ==================== -->
  <g transform="translate(800, 60)" text-anchor="middle">
    <!-- Badge -->
    <rect x="-180" y="-35" width="360" height="28" rx="14" fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-width="1"/>
    <text x="0" y="-17" fill="#D4AF37" font-size="12" font-weight="700" letter-spacing="2">★ VERIFIED SYSTEM ARCHITECTURE ★</text>
    
    <!-- Title -->
    <text x="0" y="25" fill="url(#headerGrad)" font-size="34" font-weight="800" letter-spacing="1">Chic Genie Recommendation Engine</text>
    
    <!-- Subtitle -->
    <text x="0" y="55" fill="#94A3B8" font-size="14">
      End-to-End Fashion Intelligence: Exact Taxonomy Filtering → Dense RAG → 14-Feature ML Scorer → Hybrid Reranker
    </text>
  </g>

  <!-- ==================== ROW 1: CLIENT → TAXONOMY → RAG ==================== -->

  <!-- 1. FRONTEND TIER -->
  <g transform="translate(80, 160)" filter="url(#cardShadow)">
    <rect width="430" height="200" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="20" y="-12" width="125" height="24" rx="6" fill="url(#goldGrad)"/>
    <text x="82" y="4" fill="#090B10" font-size="11" font-weight="800" text-anchor="middle">STAGE 1: CLIENT</text>
    
    <text x="24" y="42" fill="#FFFFFF" font-size="18" font-weight="700">✦ React 19 + Vite Frontend</text>
    <text x="24" y="70" fill="#94A3B8" font-size="13" width="380">
      <tspan x="24" dy="0">Interactive 6-Step Preferences Wizard capturing:</tspan>
      <tspan x="24" dy="20">• Silhouette, Occasion, Style Aesthetics, Palette</tspan>
      <tspan x="24" dy="20">• Garment Formats (Lehenga, Blazer, Hoodie, Co-ords)</tspan>
      <tspan x="24" dy="20">• Disliked Styles &amp; Colors (Negative Constraints)</tspan>
    </text>
    
    <!-- Tags -->
    <rect x="24" y="155" width="90" height="24" rx="4" fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-width="0.8"/>
    <text x="69" y="171" fill="#F8E29B" font-size="11" text-anchor="middle">AppContext</text>

    <rect x="122" y="155" width="120" height="24" rx="4" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="182" y="171" fill="#38BDF8" font-size="11" text-anchor="middle">JSON API Request</text>
  </g>

  <!-- Connection Arrow 1 -> 2 -->
  <path d="M 510 260 L 585 260" stroke="#D4AF37" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>

  <!-- 2. TAXONOMY PRE-FILTERING -->
  <g transform="translate(590, 160)" filter="url(#cardShadow)">
    <rect width="420" height="200" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="20" y="-12" width="135" height="24" rx="6" fill="#10B981"/>
    <text x="87" y="4" fill="#090B10" font-size="11" font-weight="800" text-anchor="middle">STAGE 2: PRE-FILTER</text>
    
    <text x="24" y="42" fill="#FFFFFF" font-size="18" font-weight="700">🛡️ Exact Taxonomy Engine</text>
    <text x="24" y="70" fill="#94A3B8" font-size="13">
      <tspan x="24" dy="0">Executed BEFORE RAG &amp; ML scoring:</tspan>
      <tspan x="24" dy="20">• Normalizes format to canonical keys</tspan>
      <tspan x="24" dy="20">• Filters 39 curated looks down to eligible subset</tspan>
      <tspan x="24" dy="20">• Guarantees 100% Exact Outfit-Type Compliance</tspan>
    </text>

    <!-- Tags -->
    <rect x="24" y="155" width="140" height="24" rx="4" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="0.8"/>
    <text x="94" y="171" fill="#6EE7B7" font-size="11" font-weight="600" text-anchor="middle">100% Zero-Leakage</text>

    <rect x="172" y="155" width="115" height="24" rx="4" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="229" y="171" fill="#CBD5E1" font-size="11" text-anchor="middle">39 Catalog Items</text>
  </g>

  <!-- Connection Arrow 2 -> 3 -->
  <path d="M 1010 260 L 1085 260" stroke="#D4AF37" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>

  <!-- 3. RAG RETRIEVAL -->
  <g transform="translate(1090, 160)" filter="url(#cardShadow)">
    <rect width="430" height="200" rx="14" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="20" y="-12" width="130" height="24" rx="6" fill="#8B5CF6"/>
    <text x="85" y="4" fill="#FFFFFF" font-size="11" font-weight="800" text-anchor="middle">STAGE 3: RETRIEVAL</text>
    
    <text x="24" y="42" fill="#FFFFFF" font-size="18" font-weight="700">⚡ ChromaDB RAG Service</text>
    <text x="24" y="70" fill="#94A3B8" font-size="13">
      <tspan x="24" dy="0">Dense semantic search over candidate pool:</tspan>
      <tspan x="24" dy="20">• Synthesizes multi-attribute prompt into text</tspan>
      <tspan x="24" dy="20">• SentenceTransformer: all-MiniLM-L6-v2</tspan>
      <tspan x="24" dy="20">• Cosine similarity over 384-dimensional embeddings</tspan>
    </text>

    <!-- Tags -->
    <rect x="24" y="155" width="130" height="24" rx="4" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="0.8"/>
    <text x="89" y="171" fill="#C4B5FD" font-size="11" text-anchor="middle">all-MiniLM-L6-v2</text>

    <rect x="162" y="155" width="115" height="24" rx="4" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="0.8"/>
    <text x="219" y="171" fill="#C4B5FD" font-size="11" text-anchor="middle">384-Dim Vectors</text>
  </g>

  <!-- ==================== FLOW CONNECTOR: ROW 1 TO ROW 2 ==================== -->
  <path d="M 1305 360 L 1305 405 L 295 405 L 295 440" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowGold)"/>

  <!-- ==================== ROW 2: ML SCORING → HYBRID RERANKING ==================== -->

  <!-- 4. TABULAR MACHINE LEARNING -->
  <g transform="translate(80, 450)" filter="url(#cardShadow)">
    <rect width="690" height="220" rx="14" fill="url(#cardGrad)" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="20" y="-12" width="150" height="24" rx="6" fill="url(#goldGrad)"/>
    <text x="95" y="4" fill="#090B10" font-size="11" font-weight="800" text-anchor="middle">STAGE 4: ML SCORER</text>
    
    <text x="24" y="40" fill="#FFFFFF" font-size="18" font-weight="700">🌲 14-Feature RandomForestRegressor</text>
    <text x="24" y="66" fill="#94A3B8" font-size="13">
      <tspan x="24" dy="0">Evaluates 14 engineered styling features (RAG similarity, avoid penalty, silhouette</tspan>
      <tspan x="24" dy="18">harmony, color match, drape fit, occasion suitability) for non-linear compatibility prediction.</tspan>
      <tspan x="24" dy="18">• Trained on 8,580 weakly-supervised / domain-derived synthetic fashion samples.</tspan>
    </text>

    <!-- Metrics Cards Grid -->
    <g transform="translate(24, 135)">
      <!-- R2 -->
      <rect width="140" height="60" rx="6" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <text x="70" y="28" fill="#10B981" font-size="18" font-weight="800" text-anchor="middle">0.9866</text>
      <text x="70" y="48" fill="#94A3B8" font-size="10" text-anchor="middle" letter-spacing="1">R² SCORE</text>

      <!-- MAE -->
      <rect x="155" width="140" height="60" rx="6" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <text x="225" y="28" fill="#10B981" font-size="18" font-weight="800" text-anchor="middle">0.0130</text>
      <text x="225" y="48" fill="#94A3B8" font-size="10" text-anchor="middle" letter-spacing="1">MAE</text>

      <!-- RMSE -->
      <rect x="310" width="140" height="60" rx="6" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <text x="380" y="28" fill="#10B981" font-size="18" font-weight="800" text-anchor="middle">0.0165</text>
      <text x="380" y="48" fill="#94A3B8" font-size="10" text-anchor="middle" letter-spacing="1">RMSE</text>

      <!-- Samples -->
      <rect x="465" width="175" height="60" rx="6" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
      <text x="552" y="28" fill="#D4AF37" font-size="16" font-weight="700" text-anchor="middle">1,716 Test</text>
      <text x="552" y="48" fill="#94A3B8" font-size="10" text-anchor="middle" letter-spacing="1">6,864 TRAIN / 8,580 TOT</text>
    </g>
  </g>

  <!-- Connection Arrow 4 -> 5 -->
  <path d="M 770 560 L 825 560" stroke="#D4AF37" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>

  <!-- 5. MULTI-FACTOR HYBRID RERANKING -->
  <g transform="translate(830, 450)" filter="url(#cardShadow)">
    <rect width="690" height="220" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="20" y="-12" width="160" height="24" rx="6" fill="#10B981"/>
    <text x="100" y="4" fill="#090B10" font-size="11" font-weight="800" text-anchor="middle">STAGE 5: RERANKER</text>
    
    <text x="24" y="40" fill="#FFFFFF" font-size="18" font-weight="700">⚖️ Multi-Factor Hybrid Reranker</text>
    <text x="24" y="66" fill="#94A3B8" font-size="13">
      Combines semantic retrieval, ML compatibility, heuristic rules, and silhouette harmony:
    </text>

    <!-- Formula Box -->
    <rect x="24" y="86" width="640" height="42" rx="8" fill="#0A0E17" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1"/>
    <text x="44" y="112" fill="#F8E29B" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">
      Score = 0.35·RAG + 0.35·ML + 0.15·Pref + 0.10·BodyShape + 0.05·Novelty
    </text>

    <!-- Diversity & Recency Tags -->
    <g transform="translate(24, 148)">
      <rect width="180" height="28" rx="4" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="0.8"/>
      <text x="90" y="167" fill="#6EE7B7" font-size="11" text-anchor="middle">Pairwise Diversity (0.9697)</text>

      <rect x="190" width="180" height="28" rx="4" fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-width="0.8"/>
      <text x="280" y="167" fill="#F8E29B" font-size="11" text-anchor="middle">Recency Decay Factor</text>

      <rect x="380" width="180" height="28" rx="4" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="470" y="167" fill="#38BDF8" font-size="11" text-anchor="middle">0.0% Mock Fallback</text>
    </g>
  </g>

  <!-- ==================== FLOW CONNECTOR: ROW 2 TO ROW 3 ==================== -->
  <path d="M 1175 670 L 1175 700 L 440 700 L 440 725" stroke="#D4AF37" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowGold)"/>

  <!-- ==================== ROW 3: LLM EXPLANATION → UI ==================== -->

  <!-- 6. LLM EXPLANATION LAYER -->
  <g transform="translate(80, 735)" filter="url(#cardShadow)">
    <rect width="690" height="150" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.2"/>
    <rect x="20" y="-12" width="165" height="24" rx="6" fill="#38BDF8"/>
    <text x="102" y="4" fill="#090B10" font-size="11" font-weight="800" text-anchor="middle">STAGE 6: EXPLAINER</text>
    
    <text x="24" y="38" fill="#FFFFFF" font-size="17" font-weight="700">💬 LLM Editorial Explanation Layer</text>
    <text x="24" y="64" fill="#94A3B8" font-size="13">
      <tspan x="24" dy="0">Editorial natural language presentation layer (NOT the core compatibility engine):</tspan>
      <tspan x="24" dy="18">• Synthesizes personalized styling rationales tailored to user silhouette &amp; event</tspan>
      <tspan x="24" dy="18">• Provides deterministic fallback generation when external LLM is offline</tspan>
    </text>
  </g>

  <!-- Connection Arrow 6 -> 7 -->
  <path d="M 770 810 L 825 810" stroke="#D4AF37" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>

  <!-- 7. RECOMMENDATIONS UI -->
  <g transform="translate(830, 735)" filter="url(#cardShadow)">
    <rect width="690" height="150" rx="14" fill="url(#cardGrad)" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="1.2"/>
    <rect x="20" y="-12" width="150" height="24" rx="6" fill="url(#goldGrad)"/>
    <text x="95" y="4" fill="#090B10" font-size="11" font-weight="800" text-anchor="middle">STAGE 7: DELIVERY</text>
    
    <text x="24" y="38" fill="#FFFFFF" font-size="17" font-weight="700">✨ React Recommendations UI</text>
    <text x="24" y="64" fill="#94A3B8" font-size="13">
      <tspan x="24" dy="0">Delivers final curated top looks directly into the editorial showroom:</tspan>
      <tspan x="24" dy="18">• Top-3 recommendations with Match % Badges (96%, 94%, 91%)</tspan>
      <tspan x="24" dy="18">• Silhouette harmony breakdown, palette swatches, and Wardrobe Saving</tspan>
    </text>
  </g>

  <!-- Footer Watermark -->
  <text x="800" y="930" fill="#64748B" font-size="12" text-anchor="middle">
    Chic Genie Project Architecture • Exact Pre-Filtering (39 Catalog Items) • RandomForest (R²=0.9866, MAE=0.0130, 8,580 Samples) • 0% Mock Fallback
  </text>
</svg>
